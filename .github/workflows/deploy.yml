name: Fetch Data & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 */6 * * *' # every 6 hours UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::165152433203:role/test-terraform-gha-5
          aws-region: us-east-1

      - name: Get Preset credentials from AWS SSM
        id: get-credentials
        run: |
          PRESET_CREDS=$(aws ssm get-parameter --name "/dataops/preset/data-ops-team-api-token" --with-decryption --query "Parameter.Value" --output text)
          echo "PRESET_API_TOKEN=$(echo $PRESET_CREDS | jq -r '.api_token')" >> $GITHUB_ENV
          echo "PRESET_API_SECRET=$(echo $PRESET_CREDS | jq -r '.api_secret')" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Fetch Preset data
        run: npm run fetch:data

      # Persisting the merged snapshot retains history beyond the API's rolling
      # window, and the commit keeps the schedule from being disabled for inactivity.
      # Pushes made with GITHUB_TOKEN do not retrigger this workflow.
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh Preset snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          touch dist/.nojekyll
          echo "Deployment commit: $(date -u)" > dist/DEPLOY_INFO.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
